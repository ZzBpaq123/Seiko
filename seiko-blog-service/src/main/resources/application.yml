spring:
  application:
    name: seiko-blog-service
  profiles:
    active: dev
  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Jackson 时区配置
  Jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  # mail 配置（用户名/授权码通过环境变量注入，或复制为被 .gitignore 忽略的 application-local.yml）
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

# 服务器配置
server:
  port: ${BLOG_SERVER_PORT:1002}
  servlet:
    context-path: /

# 日志配置
logging:
  level:
    com.seiko.blog: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.seiko.blog.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# spring doc-openapi 配置
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

blog:
  cors:
    allowed-origins: ${BLOG_CORS_ALLOWED_ORIGINS:http://localhost:3001}
  # 邮箱验证码安全配置
  security:
    # 邮箱验证码配置
    email-code:
      enabled: true
      # 验证码长度
      code-length: 6
      # 验证码有效期：5 分钟
      code-ttl-seconds: 300
      # 同一邮箱重发冷却：60 秒
      resend-cooldown-seconds: 60
      # 同一 IP 每小时最多发送次数
      ip-max-sends-per-hour: 3
      # IP 超限锁定：1 小时
      ip-lock-seconds: 3600
      # 邮件发件人显示名称
      sender-name: Seiko
      # 邮件主题
      subject: Seiko 邮箱验证码

  # 文件上传配置
  upload:
    # 本地存储目录，支持相对路径或绝对路径
    path: ${BLOG_UPLOAD_PATH:./uploads}
    # 浏览器访问路径前缀
    url-prefix: /uploads
    # 单个文件最大限制，单位字节，默认 10MB
    max-size: 10485760
    # 允许上传的文件 MIME 类型
    allowed-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

seiko:
  cors:
    allowed-origins: ${blog.cors.allowed-origins}
