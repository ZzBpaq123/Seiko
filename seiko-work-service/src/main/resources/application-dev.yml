spring:
  config:
    activate:
      on-profile: dev

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: JDBC:mysql://localhost:3306/seiko_work?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 2
      password: ${REDIS_PASSWORD:123456}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# 日志级别
logging:
  level:
    com.seiko.work: INFO
    com.baomidou.mybatisplus: INFO

# 开发环境按需启用 API 文档，禁止打印 SQL 参数中的个人信息
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
